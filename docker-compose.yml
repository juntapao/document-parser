services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: document-parser-api
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      XDEBUG_MODE: debug,develop
      XDEBUG_CONFIG: client_host=host.docker.internal client_port=9003
